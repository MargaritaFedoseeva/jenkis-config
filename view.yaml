- view:
    name: 'QA'
    description: 'Тесты'
    view-type: list
    # Какие джобы включать в эту вкладку (фильтр по имени):
    regex: '.*-test'
    # Какие колонки отображать в таблице внутри вкладки:
    columns:
      - status
      - weather
      - job
      - last-success
      - last-failure
      - last-duration
      - build-button