---
# BUILDERS - шаги сборки, которые выполняются последовательно во время билда.
# Каждый builder — это отдельная команда или набор команд в shell.
# Используется для компиляции, тестирования, анализа кода и других задач сборки.
- builder:
    name: maven-build
    builders:
      - shell: |
          # Компилируем проект и упаковываем в JAR.
          # -DskipTests=false — явно указываем что тесты НЕ пропускаем при сборке.
          # clean — удаляем предыдущие артефакты перед новой сборкой.
          mvn clean package -DskipTests=false

- builder:
    name: run-tests
    builders:
      - shell: |
          # Запускаем юнит-тесты и генерируем отчёты в target/surefire-reports/.
          # Эти отчёты потом подхватывает publisher junit для отображения в Jenkins UI.
          mvn test
          # Запускаем анализ кода через SonarQube.
          # Помогает отслеживать качество кода, покрытие тестами и уязвимости.
          mvn sonar:sonar

# PUBLISHERS - действия после завершения сборки (успешной или нет).
# Используется для сохранения артефактов, публикации отчётов и уведомлений команды.
- publisher:
    name: archive-artifacts
    publishers:
      # Сохраняем собранный JAR файл как артефакт билда в Jenkins.
      # Артефакт можно скачать прямо из интерфейса Jenkins после завершения билда.
      # allow-empty: false — билд упадёт если JAR не был создан (защита от тихих ошибок).
      - archive:
          artifacts: 'target/*.jar'
          allow-empty: false

- publisher:
    name: publish-results
    publishers:
      # Парсим XML отчёты surefire и отображаем результаты тестов в Jenkins UI.
      # Jenkins строит график трендов тестов — можно видеть историю падений.
      - junit:
          results: 'target/surefire-reports/*.xml'
      # Отправляем email уведомления команде разработчиков.
      # failure: true — письмо при падении билда.
      # fixed: true — письмо когда билд восстановился после падения.
      - email-ext:
          recipients: <team-email>
          send-to:
            - developers
          failure: true
          fixed: true

# WRAPPERS - оборачивают весь билд, выполняются ДО и ПОСЛЕ основных шагов.
# Используется для настройки окружения, ограничений времени и форматирования логов.
- wrapper:
    name: build-env
    wrappers:
      # Автоматически завершаем билд если он выполняется дольше 30 минут.
      # Защищает от зависших джобов которые блокируют агентов Jenkins.
      - timeout:
          timeout: 30
      # Добавляем временные метки к каждой строке в консольном логе.
      # Помогает понять сколько времени занимает каждый шаг сборки.
      - timestamps
      # Включаем цветной вывод в консоли Jenkins.
      # Делает логи читаемее — ошибки красным, успех зелёным.
      - ansicolor

# TRIGGERS - определяют когда джоб запускается автоматически.
# Без триггеров джоб можно запустить только вручную.
- trigger:
    name: daily-trigger
    triggers:
      # Запускаем полную сборку каждый день в 2 ночи.
      # H означает случайную минуту в пределах часа — распределяет нагрузку на Jenkins.
      # Ночной билд позволяет команде видеть результаты утром перед началом работы.
      - timed: 'H 2 * * *'
      # Опрашиваем SCM (Git) каждые 5 минут на наличие новых коммитов.
      # Если найдены изменения — автоматически запускаем билд.
      # Альтернатива webhook'ам когда нет прямого доступа к репозиторию.
      - pollscm:
          cron: 'H/5 * * * *'
