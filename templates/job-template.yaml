- job-template:
    name: '{project-name}-test'
    description: 'Pipeline джоб для проекта {project-name}'
    project-type: pipeline

    parameters:
      - string:
          name: BRANCH
          default: master

    pipeline-scm:
      scm:
        - git:
            url: '{repo-url}'
            branches:
              - '*/main'
              - '*/master'
      script-path: Jenkinsfile
      lightweight-checkout: true