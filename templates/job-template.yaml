- job-template:
    name: '{project-name}-test'
    description: 'Pipeline джоб для проекта {project-name}'
    project-type: pipeline

    parameters:
      - string:
          name: BRANCH
          default: master
          description: 'Укажите ветку для сборки и чтения Jenkinsfile'

    pipeline-scm:
      scm:
        - git:
            url: '{repo-url}'
            branches:
              - '${BRANCH}'
      script-path: Jenkinsfile
      lightweight-checkout: false