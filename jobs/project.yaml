- job:
    name: all-start-test
    project-type: pipeline
    description: 'Запуск pipeline api-test и playwright-test одной кнопкой'
    parameters:
        - string:
              name: API_BRANCH
              default: 'main'
              description: 'Ветка для проекта api-test'
        - string:
              name: PLAYWRIGHT_BRANCH
              default: 'master'
              description: 'Ветка для проекта playwright-test'
    dsl: !include-raw-escape Jenkinsfile

- project:
    name: api
    project-name: api
    repo-url: 'https://github.com/MargaritaFedoseeva/otusHomework3.git'
    jobs:
      # Итоговое имя джоба в Jenkins: api-pipeline
      - '{project-name}-test'

- project:
    name: playwright
    project-name: playwright
    repo-url: 'https://github.com/MargaritaFedoseeva/otusHomework6.git'
    jobs:
      - '{project-name}-test'

